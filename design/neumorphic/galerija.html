<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Žodžių praktika — Neumorphic UI ekranai</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f0f4fa;color:#172033;font:16px/1.5 system-ui,"Segoe UI",sans-serif}
    main{max-width:1100px;margin:auto;padding:28px 18px 60px}
    h1{font-size:clamp(24px,4vw,34px);margin:0 0 6px}
    p{margin:0 0 24px;color:#5d697d}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:26px}
    figure{margin:0}
    a{display:block;border-radius:18px;overflow:hidden;box-shadow:8px 8px 20px #a9b6c475,-8px -8px 20px #ffffffcc;background:#f8faff}
    a:focus-visible{outline:3px solid #2878f4;outline-offset:4px}
    img{display:block;width:100%;height:auto}
    figcaption{font-size:15px;font-weight:600;padding:12px 3px 0}
  </style>
</head>
<body>
<main>
  <h1>Žodžių praktika — Neumorphic UI</h1>
  <p>Šviesesnio fono ekranai. Paspauskite vaizdą, jei norite jį atidaryti visu dydžiu.</p>
  <div class="grid">
    <figure><a href="00-mokinys.png"><img src="00-mokinys.png" alt="Mokinio pasirinkimo ekranas"></a><figcaption>Mokinys</figcaption></figure>
    <figure><a href="00a-sarasai.png"><img src="00a-sarasai.png" alt="Žodžių sąrašų ekranas"></a><figcaption>Sąrašai</figcaption></figure>
    <figure><a href="01-zodziu-ivedimas.png"><img src="01-zodziu-ivedimas.png" alt="Žodžių redagavimo ir porų peržiūros ekranas"></a><figcaption>Žodžių redagavimas</figcaption></figure>
    <figure><a href="01b-viktorina-paruosta.png"><img src="01b-viktorina-paruosta.png" alt="Viktorinos pradžios ekranas"></a><figcaption>Viktorinos pradžia</figcaption></figure>
    <figure><a href="02-viktorina.png"><img src="02-viktorina.png" alt="Aktyvi viktorina, 42 sekundės"></a><figcaption>Viktorina</figcaption></figure>
    <figure><a href="02a-viktorina-10s.png"><img src="02a-viktorina-10s.png" alt="Viktorina, liko 10 sekundžių, geltonas laikmatis"></a><figcaption>Liko 10 sekundžių</figcaption></figure>
    <figure><a href="02b-viktorina-3s.png"><img src="02b-viktorina-3s.png" alt="Viktorina, liko 3 sekundės, raudonas laikmatis"></a><figcaption>Liko 3 sekundės</figcaption></figure>
    <figure><a href="02c-teisingas-atsakymas.png"><img src="02c-teisingas-atsakymas.png" alt="Pateikto žodžio laukelis žalias po teisingo atsakymo"></a><figcaption>Teisingas atsakymas</figcaption></figure>
    <figure><a href="02d-neteisingas-atsakymas.png"><img src="02d-neteisingas-atsakymas.png" alt="Pateikto žodžio laukelis raudonas po neteisingo atsakymo"></a><figcaption>Neteisingas atsakymas</figcaption></figure>
    <figure><a href="03-rezultatai.png"><img src="03-rezultatai.png" alt="Rezultatai: teisingai, neteisingai ir neatsakyta"></a><figcaption>Rezultatai</figcaption></figure>
  </div>
</main>
</body>
</html>
